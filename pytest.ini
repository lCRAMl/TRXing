[pytest]
testpaths = tests

# Auf diesem Rechner liegen PyQt6 und PySide6 nebeneinander. qtpy - und damit
# pytest-qt - bevorzugt sonst PySide6 und laedt dessen Qt6Core.dll in den
# Prozess; der anschliessende Import von PyQt6.QtCore scheitert dann mit
# "DLL load failed", weil die bereits geladene Bibliothek nicht zu ihm passt.
# Die Anwendung selbst benutzt ausschliesslich PyQt6, also wird pytest-qt
# darauf festgelegt.
qt_api = pyqt6

filterwarnings =
    ignore::DeprecationWarning
